<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pattyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2E9DE"/>
    </linearGradient>
    <linearGradient id="grillPatty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B4E2B"/>
      <stop offset="60%" stop-color="#553319"/>
      <stop offset="100%" stop-color="#341C0A"/>
    </linearGradient>
    <filter id="pattyFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4A2F1A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#pattyBg)"/>
  <circle cx="200" cy="145" r="105" fill="#EADCCF" opacity="0.45"/>

  <!-- Sizzling charcoal / iron grill -->
  <g filter="url(#pattyFilter)" transform="translate(0, 10)">
    <!-- Cast Iron Skillet / Charcoal Grill Net -->
    <circle cx="200" cy="145" r="88" fill="#2B2623" stroke="#483E38" stroke-width="5"/>
    <circle cx="200" cy="145" r="80" fill="#1C1816"/>
    
    <!-- Charcoal Glow -->
    <circle cx="200" cy="145" r="70" fill="#C84B1D" opacity="0.25"/>

    <!-- Grill mesh lines -->
    <path d="M 135,130 L 265,130 M 130,150 L 270,150 M 135,170 L 265,170" stroke="#77685F" stroke-width="3" stroke-linecap="round"/>
    <path d="M 170,100 L 170,195 M 200,95 L 200,200 M 230,100 L 230,195" stroke="#77685F" stroke-width="3" stroke-linecap="round"/>

    <!-- Sizzling Hamburg Patty -->
    <ellipse cx="200" cy="145" rx="58" ry="36" fill="url(#grillPatty)"/>
    
    <!-- Char marks -->
    <path d="M 160,135 Q 200,146 240,135" stroke="#1D0E05" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 165,147 Q 200,158 235,147" stroke="#1D0E05" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 172,159 Q 200,168 228,159" stroke="#1D0E05" stroke-width="4" stroke-linecap="round"/>

    <!-- Glossy Meat Juice Drops & Sizzle Sparks -->
    <circle cx="185" cy="138" r="3" fill="#FFC369" opacity="0.8"/>
    <circle cx="215" cy="145" r="3.5" fill="#FFC369" opacity="0.85"/>
    <circle cx="198" cy="154" r="2.5" fill="#FFC369" opacity="0.9"/>
    
    <!-- Rising Heat Steam lines -->
    <path d="M 180,95 Q 170,75 182,55" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 205,90 Q 215,70 203,50" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 225,95 Q 235,75 224,55" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Title Badge -->
  <rect x="110" y="240" width="180" height="36" rx="18" fill="#5C3A21"/>
  <text x="200" y="263" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">多汁鮮嫩・職人手作</text>
</svg>
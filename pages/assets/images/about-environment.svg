<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="envBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D231C"/>
      <stop offset="60%" stop-color="#443428"/>
      <stop offset="100%" stop-color="#604938"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFD478" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFD478" stop-opacity="0"/>
    </radialGradient>
    <filter id="envFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Warm Dining Background -->
  <rect width="600" height="400" rx="20" fill="url(#envBg)"/>

  <!-- Wooden Slat Wall Backing -->
  <g stroke="#3A2D23" stroke-width="3" opacity="0.4">
    <line x1="60" y1="0" x2="60" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="420" y1="0" x2="420" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="540" y1="0" x2="540" y2="400"/>
  </g>

  <!-- Hanging Pendant Lamps with Warm Amber Glow -->
  <!-- Lamp 1 -->
  <line x1="180" y1="0" x2="180" y2="90" stroke="#1A1410" stroke-width="2"/>
  <circle cx="180" cy="130" r="75" fill="url(#lampGlow)"/>
  <path d="M 160,95 L 200,95 L 210,115 L 150,115 Z" fill="#2D5A3F" stroke="#E2B874" stroke-width="2"/>
  <circle cx="180" cy="118" r="6" fill="#FFF2CE"/>

  <!-- Lamp 2 -->
  <line x1="300" y1="0" x2="300" y2="75" stroke="#1A1410" stroke-width="2"/>
  <circle cx="300" cy="115" r="85" fill="url(#lampGlow)"/>
  <path d="M 280,80 L 320,80 L 330,100 L 270,100 Z" fill="#2D5A3F" stroke="#E2B874" stroke-width="2"/>
  <circle cx="300" cy="103" r="6" fill="#FFF2CE"/>

  <!-- Lamp 3 -->
  <line x1="420" y1="0" x2="420" y2="90" stroke="#1A1410" stroke-width="2"/>
  <circle cx="420" cy="130" r="75" fill="url(#lampGlow)"/>
  <path d="M 400,95 L 440,95 L 450,115 L 390,115 Z" fill="#2D5A3F" stroke="#E2B874" stroke-width="2"/>
  <circle cx="420" cy="118" r="6" fill="#FFF2CE"/>

  <!-- Warm Wooden Counter Bar -->
  <g filter="url(#envFilter)">
    <!-- Counter Surface -->
    <polygon points="40,240 560,240 600,285 0,285" fill="#B38A60"/>
    <polygon points="0,285 600,285 600,310 0,310" fill="#886440"/>
    <rect x="0" y="310" width="600" height="90" fill="#583E26"/>

    <!-- Place Settings on Counter -->
    <!-- Seat 1 Setting -->
    <rect x="110" y="250" width="85" height="24" rx="4" fill="#E8DFD3" opacity="0.8"/>
    <circle cx="152" cy="262" r="8" fill="#FFFFFF"/>
    <!-- Chopsticks -->
    <line x1="202" y1="250" x2="202" y2="274" stroke="#503823" stroke-width="2"/>

    <!-- Seat 2 Setting -->
    <rect x="255" y="250" width="90" height="24" rx="4" fill="#E8DFD3" opacity="0.8"/>
    <circle cx="300" cy="262" r="8" fill="#FFFFFF"/>
    <line x1="352" y1="250" x2="352" y2="274" stroke="#503823" stroke-width="2"/>

    <!-- Seat 3 Setting -->
    <rect x="405" y="250" width="85" height="24" rx="4" fill="#E8DFD3" opacity="0.8"/>
    <circle cx="447" cy="262" r="8" fill="#FFFFFF"/>
    <line x1="497" y1="250" x2="497" y2="274" stroke="#503823" stroke-width="2"/>

    <!-- Modern Wooden Stools Backrest Hints -->
    <ellipse cx="150" cy="360" rx="36" ry="12" fill="#754E2B" stroke="#482E16" stroke-width="3"/>
    <ellipse cx="300" cy="360" rx="36" ry="12" fill="#754E2B" stroke="#482E16" stroke-width="3"/>
    <ellipse cx="450" cy="360" rx="36" ry="12" fill="#754E2B" stroke="#482E16" stroke-width="3"/>
  </g>

  <!-- Potted Plant on Edge (Deep Green Accent) -->
  <g transform="translate(50, 185)">
    <polygon points="10,48 26,48 22,25 14,25" fill="#FFFFFF" stroke="#D1C4B2" stroke-width="1.5"/>
    <ellipse cx="18" cy="22" rx="10" ry="14" fill="#2D5A3F"/>
    <ellipse cx="12" cy="25" rx="7" ry="10" fill="#3D7B54"/>
    <ellipse cx="24" cy="24" rx="7" ry="10" fill="#1E3E2A"/>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="340" width="240" height="40" rx="20" fill="#2D5A3F"/>
  <text x="300" y="365" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">溫潤木質・開放吧台空間</text>
</svg>
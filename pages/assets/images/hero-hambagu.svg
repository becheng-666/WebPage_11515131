<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="60%" stop-color="#F3EBE0"/>
      <stop offset="100%" stop-color="#EADBCE"/>
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E4423"/>
      <stop offset="40%" stop-color="#553319"/>
      <stop offset="100%" stop-color="#3B220F"/>
    </linearGradient>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84481C"/>
      <stop offset="100%" stop-color="#5A2E0F"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5DECE"/>
    </linearGradient>
    <linearGradient id="yolkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB338"/>
      <stop offset="60%" stop-color="#F97E00"/>
      <stop offset="100%" stop-color="#D95700"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4A3018" flood-opacity="0.18"/>
    </filter>
    <filter id="pattyShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#261408" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Decorative subtle Japanese pattern rings in background -->
  <circle cx="600" cy="420" r="340" fill="none" stroke="#DCCEC0" stroke-width="2" stroke-dasharray="6,8"/>
  <circle cx="600" cy="420" r="300" fill="none" stroke="#D1BEAC" stroke-width="1.5"/>

  <!-- Warm Wooden Counter Base -->
  <ellipse cx="600" cy="670" rx="460" ry="85" fill="#CBB69E" opacity="0.45"/>
  <ellipse cx="600" cy="660" rx="420" ry="70" fill="#BA9E80" opacity="0.55"/>

  <!-- Steam effects from rice and meat -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M540,240 Q520,200 545,160 T535,110"/>
    <path d="M600,225 Q585,185 605,145 T595,95"/>
    <path d="M660,240 Q640,200 665,160 T655,110"/>
  </g>

  <!-- Dish Container Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Elegant Ceramic Rice Bowl -->
    <path d="M 380,480 Q 400,680 600,690 Q 800,680 820,480 Z" fill="url(#bowlGrad)" stroke="#C8BFAF" stroke-width="4"/>
    <!-- Bowl rim top -->
    <ellipse cx="600" cy="480" rx="220" ry="50" fill="#F4EFE6" stroke="#D1C7B8" stroke-width="3"/>
    
    <!-- Bowl Decorative Traditional Stripe (Deep Green Accent) -->
    <path d="M 405,530 Q 600,625 795,530" fill="none" stroke="#2D5A3F" stroke-width="7" stroke-linecap="round"/>
    <path d="M 435,570 Q 600,650 765,570" fill="none" stroke="#7B4E2B" stroke-width="3" stroke-linecap="round"/>

    <!-- Shiny Steaming White Rice Mound -->
    <path d="M 410,470 C 420,380 470,330 600,330 C 730,330 780,380 790,470 C 760,490 640,510 600,510 C 560,510 440,490 410,470 Z" fill="#FCFCFC"/>
    
    <!-- Grains texture accents -->
    <ellipse cx="500" cy="410" rx="14" ry="7" fill="#F0EDE4" transform="rotate(-15, 500, 410)"/>
    <ellipse cx="680" cy="415" rx="15" ry="8" fill="#F0EDE4" transform="rotate(20, 680, 415)"/>
    <ellipse cx="460" cy="435" rx="12" ry="6" fill="#F0EDE4" transform="rotate(10, 460, 435)"/>
    <ellipse cx="730" cy="440" rx="13" ry="6" fill="#F0EDE4" transform="rotate(-10, 730, 440)"/>

    <!-- Thick Juicy Grilled Hamburg Steak Patty (挽肉漢堡排) -->
    <g filter="url(#pattyShadow)">
      <ellipse cx="600" cy="365" rx="175" ry="80" fill="url(#pattyGrad)"/>
      <ellipse cx="600" cy="355" rx="165" ry="70" fill="#754724"/>
      
      <!-- Grill marks and texture -->
      <path d="M 490,340 Q 590,365 710,340" fill="none" stroke="#361B09" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <path d="M 480,365 Q 600,390 720,365" fill="none" stroke="#361B09" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
      <path d="M 505,390 Q 600,410 695,390" fill="none" stroke="#361B09" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

      <!-- Rich Savory Glaze & Sauce Highlights -->
      <path d="M 520,335 C 560,350 640,350 680,335 C 670,360 620,375 580,370 C 540,365 525,350 520,335 Z" fill="url(#sauceGrad)" opacity="0.6"/>
    </g>

    <!-- Golden Farm Fresh Egg Yolk on top (生生金黃蛋黃) -->
    <ellipse cx="600" cy="335" rx="42" ry="32" fill="url(#yolkGrad)"/>
    <ellipse cx="588" cy="326" rx="14" ry="8" fill="#FFF2CE" opacity="0.75" transform="rotate(-20, 588, 326)"/>

    <!-- Fresh Chopped Scallions (深綠青蔥配菜) -->
    <rect x="525" y="365" width="16" height="8" rx="3" fill="#2D5A3F" transform="rotate(35, 525, 365)"/>
    <rect x="670" y="360" width="18" height="9" rx="3" fill="#3D7B54" transform="rotate(-25, 670, 360)"/>
    <rect x="545" y="395" width="15" height="8" rx="3" fill="#2D5A3F" transform="rotate(-15, 545, 395)"/>
    <rect x="645" y="385" width="16" height="8" rx="3" fill="#4B8E64" transform="rotate(20, 645, 385)"/>
    <rect x="590" y="390" width="14" height="7" rx="3" fill="#22482E" transform="rotate(5, 590, 390)"/>

    <!-- Side Dish: Pickled Radish & Crispy Garlic Chips -->
    <!-- Garlic slice -->
    <circle cx="460" cy="405" r="9" fill="#E6BA6E" stroke="#B88A3A" stroke-width="2"/>
    <circle cx="735" cy="410" r="10" fill="#E6BA6E" stroke="#B88A3A" stroke-width="2"/>
  </g>

  <!-- Brand Typography Badge on Image -->
  <g transform="translate(60, 60)">
    <rect width="210" height="52" rx="26" fill="#2D5A3F" opacity="0.95"/>
    <text x="105" y="33" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="1">哈基米挽肉・招牌現烤</text>
  </g>
</svg>